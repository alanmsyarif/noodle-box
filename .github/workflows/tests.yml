name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Blender's Python module needs the same shared libraries the Blender
      # binary does. These are the X11/GL ones the manylinux wheel links
      # against; if the first run fails on a missing .so, add it here.
      - name: System libraries for bpy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6

      # bpy is version-locked to one Blender release and to one CPython, and
      # 5.2.x ships cp313 wheels only. Pinning both is the point: the suite is
      # testing a specific solver against a specific Geometry Nodes API.
      - name: Install bpy and pytest
        run: |
          python -m pip install --upgrade pip
          pip install "bpy==5.2.1" pytest

      - name: Run the suite
        run: pytest tests/ -v
